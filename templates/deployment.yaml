apiVersion: apps/v1
kind: Deployment

metadata:
  name: ipl-ticket-booking

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: ipl-ticket-booking

  template:
    metadata:
      labels:
        app: ipl-ticket-booking

    spec:
      containers:
      - name: ipl-ticket-booking

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: {{ .Values.containerPort }}