<!-- login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;

            background:url('images/stadium.jpg') center/cover no-repeat;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .overlay{
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
        }

        .login-container{
            position:relative;
            z-index:1;

            width:350px;
            background:white;

            padding:35px;
            border-radius:12px;

            box-shadow:0 5px 15px rgba(0,0,0,0.3);

            text-align:center;
        }

        .login-container img{
            width:80px;
            margin-bottom:10px;
        }

        .login-container h2{
            margin-bottom:25px;
            color:#111827;
        }

        .input-group{
            margin-bottom:18px;
            text-align:left;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }

        .login-btn{
            width:100%;
            padding:12px;

            border:none;
            border-radius:6px;

            background:#ff512f;
            color:white;

            font-size:16px;
            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{
            background:#e63e1d;
        }

        .extra-links{
            margin-top:15px;
        }

        .extra-links a{
            text-decoration:none;
            color:#2563eb;
            font-size:14px;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

        .message{
            margin-top:15px;
            color:green;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="overlay"></div>

    <div class="login-container">

        <img src="images/logo.png" alt="IPL Logo">

        <h2>IPL Ticket Booking Login</h2>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>

                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input 
                    type="password" 
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="extra-links">
            <a href="#">Forgot Password?</a>
            <br><br>
            <a href="register.html">Create New Account</a>
        </div>

        <p class="message" id="message"></p>

    </div>

<script>

document.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email === "" || password === ""){
        alert("Please fill all fields");
        return;
    }

    // Dummy Login Validation

    if(email === "admin@gmail.com" && password === "admin123"){

        document.getElementById("message").innerHTML =
            "✅ Login Successful";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

    }else{

        document.getElementById("message").style.color = "red";

        document.getElementById("message").innerHTML =
            "❌ Invalid Email or Password";
    }

});

</script>

</body>
</html>
